[package]
name = "woodsketch-ui-egui"
description = "egui user interface for WoodSketch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
woodsketch-doc.workspace = true
rfd.workspace = true
woodsketch-tools.workspace = true
woodsketch-view.workspace = true
woodsketch-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
# Sending a report to woodsketch.net (already built for Velopack's update checks).
ureq = "3.4"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true

[lints]
workspace = true
