[package]
name = "woodsketch-ui-egui"
description = "egui user interface for WoodSketch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
woodsketch-doc.workspace = true
woodsketch-i18n.workspace = true
rfd.workspace = true
woodsketch-tools.workspace = true
woodsketch-view.workspace = true
woodsketch-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# Thumbnails are drawn on the app's own device, so the types are named here.
wgpu.workspace = true
glam.workspace = true
# Which tray panels are open, kept in eframe's settings.
serde.workspace = true
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
# Sending a report to woodsketch.net, and the roots to trust doing it (`net.rs`).
ureq.workspace = true
# Thumbnails kept between runs (the CLI already builds this to write its pictures).
png = "0.18"
# A graphics error in full, where the status bar only has room for its first line (`gpu.rs`).
log = { workspace = true, default-features = false }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true

[lints]
workspace = true
