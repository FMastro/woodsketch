[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
woodsketch-doc = { path = "crates/doc" }
woodsketch-tools = { path = "crates/tools" }
woodsketch-view = { path = "crates/view" }
woodsketch-render = { path = "crates/render" }
woodsketch-ui-egui = { path = "crates/ui-egui" }

# external
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_kittest = "0.36"
# Must stay on the same major version egui-wgpu uses, or the device types won't match.
wgpu = "30"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = "1"
earcut = "0.4"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: coordinates must reload bit-for-bit, or a reopened drawing drifts.
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = "0.17"
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies optimized even in dev builds, so the viewport stays smooth while debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
