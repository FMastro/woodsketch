name: Release

# Pushing a tag like v0.1.0 (matching the version in Cargo.toml) builds WoodSketch for every
# platform, packs each with Velopack (an installer plus what the app's updater downloads), and
# gathers everything into a DRAFT GitHub release. Publish the draft to make it public and
# offer it to installed copies as an update.
#
# Each platform has its own update channel, named in its files, so an update never crosses
# platforms or processors. Windows is signed with Azure Artifact Signing and macOS with an
# Apple Developer ID, each when its settings below are there; Linux is unsigned (it needs no
# signature to run). Either build still runs without them and ships unsigned, so a fork with
# neither account can cut a release.
#
# Windows signing needs these repository variables, and the `release` environment the package
# job names (the signing app's federated credential trusts
# repo:<owner>/<repo>:environment:release, so no key or secret is stored anywhere):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   the app that signs, over OIDC
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE   what it signs with
#
# macOS signing needs these repository secrets, which docs/MACOS-SIGNING.md makes:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID Application identity
#   MACOS_SIGNING_IDENTITY                       the name to sign under, out of the certificate
#   MACOS_APPLE_ID, MACOS_TEAM_ID, MACOS_APP_PASSWORD   for notarizing with Apple
# The .pkg installer needs a Developer ID Installer identity as well, which is a second
# certificate (MACOS_INSTALLER_P12_BASE64, MACOS_INSTALLER_PASSWORD, MACOS_INSTALLER_IDENTITY).
# Without it the app is signed and notarized but the installer around it isn't, so Gatekeeper
# warns about the .pkg and not about what it installs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Must equal the velopack crate version in apps/woodsketch/Cargo.toml.
  VPK_VERSION: 1.2.161
  # Microsoft's Sign CLI, for the one file vpk doesn't sign for us (see Pack). It is only
  # published as a prerelease, and the stable `Sign` package on NuGet is a different tool.
  SIGN_VERSION: 0.9.1-beta.26475.3

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Version from Cargo.toml, matching the tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    name: ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, channel: win-x64, runtime: win-x64, exe: woodsketch.exe, cli: woodsketch-cli.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, channel: osx-arm64, runtime: osx-arm64, exe: woodsketch, cli: woodsketch-cli }
          - { os: macos-latest, target: x86_64-apple-darwin, channel: osx-x64, runtime: osx-x64, exe: woodsketch, cli: woodsketch-cli }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, channel: linux-x64, runtime: linux-x64, exe: woodsketch, cli: woodsketch-cli }
    runs-on: ${{ matrix.os }}
    # The environment the signing app's federated credential trusts; id-token lets the runner
    # prove who it is to Azure without a stored secret.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries (windowing, file dialogs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb-dev
      - name: Build
        shell: bash
        run: cargo build --release --locked -p woodsketch -p woodsketch-cli --target ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      # Signing is skipped whole when the variables aren't set, so a release can still be cut
      # before signing is configured, or if it ever has to be turned off.
      - name: Sign in to Azure
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare signing
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          # vpk reads the account to sign with from this file; the credentials come from the
          # sign-in above (DefaultAzureCredential finds the Azure CLI's session).
          cat > "$RUNNER_TEMP/azure-signing.json" <<JSON
          {
            "Endpoint": "${{ vars.AZURE_SIGNING_ENDPOINT }}",
            "CodeSigningAccountName": "${{ vars.AZURE_SIGNING_ACCOUNT }}",
            "CertificateProfileName": "${{ vars.AZURE_SIGNING_PROFILE }}"
          }
          JSON
          echo "AZURE_SIGN_FILE=$RUNNER_TEMP/azure-signing.json" >> "$GITHUB_ENV"
          dotnet tool install -g sign --version "$SIGN_VERSION"
      # Apple will only sign from a keychain, so the identity is imported into one made for this
      # run and thrown away with the runner. Skipped whole when the secrets aren't there, the way
      # Windows signing is, and then nothing below signs anything.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
        run: |
          if [ -z "${CERT:-}" ]; then
            echo "No Apple identity in the secrets, so this build ships unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/woodsketch-signing.keychain-db"
          password=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Don't let it lock while Apple notarizes, which takes minutes and can take longer.
          security set-keychain-settings -lut 21600 "$keychain"
          # A keychain that isn't on the search list imports the identity but offers none that is
          # valid, and codesign then can't find one at all (docs/MACOS-SIGNING.md).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"' | xargs)
          take() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/identity.p12"
          }
          take "$CERT" "$CERT_PASSWORD"
          if [ -n "${INSTALLER_CERT:-}" ]; then
            take "$INSTALLER_CERT" "$INSTALLER_PASSWORD"
            echo "MACOS_INSTALLER=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          else
            echo "No Developer ID Installer identity, so the .pkg will not be signed."
          fi
          # Without this, signing stops to ask for the keychain password, which nobody can type.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain"
          # Notarizing is a separate credential; vpk reaches it by this profile's name.
          xcrun notarytool store-credentials woodsketch-ci --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: macOS icon (.icns from the PNGs)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set=assets/icon/WoodSketch.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            cp "assets/icon/woodsketch-$s.png" "$set/icon_${s}x${s}.png"
            cp "assets/icon/woodsketch-$((s * 2)).png" "$set/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$set" -o assets/icon/woodsketch.icns
      - name: Pack
        shell: bash
        run: |
          mkdir -p publish releases
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" publish/
          # Windows keeps function names and line numbers apart from the program: beside it, a
          # crash report can say which calls led to the crash.
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/woodsketch.pdb" publish/
          fi
          # The licenses of everything WoodSketch is built with, installed beside the app
          # (MIT and the rest want their notices to travel with the program).
          cp THIRD-PARTY-NOTICES.md publish/
          # The command line and MCP server for agents, installed beside the app.
          cp "target/${{ matrix.target }}/release/${{ matrix.cli }}" publish/
          # vpk signs a copy of publish/, not publish/ itself, so the command line on its own
          # (zipped from publish/ below) would go out unsigned. Sign it here first: vpk leaves
          # a file already signed and trusted alone, so it isn't signed twice.
          if [ -n "${AZURE_SIGN_FILE:-}" ]; then
            sign code trusted-signing "publish/${{ matrix.cli }}" \
              --trusted-signing-endpoint "${{ vars.AZURE_SIGNING_ENDPOINT }}" \
              --trusted-signing-account "${{ vars.AZURE_SIGNING_ACCOUNT }}" \
              --trusted-signing-certificate-profile "${{ vars.AZURE_SIGNING_PROFILE }}"
          fi
          # The same on macOS: vpk signs the copy it puts inside the .app, not this one.
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then
            codesign --force --timestamp --options runtime \
              --keychain "$MACOS_KEYCHAIN" --sign "$MACOS_IDENTITY" "publish/${{ matrix.cli }}"
          fi
          case "${{ runner.os }}" in
            Windows) icon=assets/icon/woodsketch.ico ;;
            macOS) icon=assets/icon/woodsketch.icns ;;
            *) icon=assets/icon/woodsketch-512.png ;;
          esac
          # One of these at most: each platform signs with its own, or with nothing.
          sign_args=()
          if [ -n "${AZURE_SIGN_FILE:-}" ]; then
            sign_args=(--azureTrustedSignFile "$AZURE_SIGN_FILE")
          fi
          # vpk signs the .app, sends it to Apple, waits, and staples the answer onto it, which
          # is what lets it open on a machine that has never seen it. `--keychain` is missing
          # from vpk's own help but is there in the version pinned above, and both codesign and
          # notarytool need it to look anywhere but the login keychain. The .pkg around the app
          # only gets the same treatment when a Developer ID Installer identity is there too.
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then
            sign_args=(
              --signAppIdentity "$MACOS_IDENTITY"
              --notaryProfile woodsketch-ci
              --keychain "$MACOS_KEYCHAIN"
            )
            if [ -n "${MACOS_INSTALLER:-}" ]; then
              sign_args+=(--signInstallIdentity "$MACOS_INSTALLER")
            fi
          fi
          vpk pack \
            --packId WoodSketch \
            --packVersion "$VERSION" \
            --packTitle WoodSketch \
            --packAuthors "Fred Mastropasqua" \
            --packDir publish \
            --mainExe "${{ matrix.exe }}" \
            --channel "${{ matrix.channel }}" \
            --runtime "${{ matrix.runtime }}" \
            --icon "$icon" \
            --outputDir releases \
            "${sign_args[@]}"
          # The command line on its own too, for a machine without the app (a server, CI).
          cli_zip="woodsketch-cli-$VERSION-${{ matrix.channel }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'publish/${{ matrix.cli }}' -DestinationPath 'releases/$cli_zip'"
          else
            zip -j "releases/$cli_zip" "publish/${{ matrix.cli }}"
          fi
          # A zip can't carry a stapled ticket, so Apple is asked about this one the first time
          # it runs. Signing it alone wouldn't be enough: macOS refuses a downloaded program it
          # can't ask about.
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then
            xcrun notarytool submit "releases/$cli_zip" --wait \
              --keychain-profile woodsketch-ci --keychain "$MACOS_KEYCHAIN"
          fi
          ls -l releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases-${{ matrix.channel }}
          path: releases/*
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: releases-*
          path: release
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: CHANGELOG.md
      - name: Draft the release
        shell: bash
        run: |
          ls -l release
          # This version's section of CHANGELOG.md (between its heading and the next).
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' source/CHANGELOG.md > changes.md
          # Releases are small and frequent, so one version's notes read like one small change.
          # The nine before it go in a folded block, each under its version, so someone who
          # skipped a few sees everything they're getting and which release brought it.
          awk -v v="## $VERSION" '
            $0 == v { seen = 1; next }                      # skip this version: it is above
            /^## / { if (seen) { kept++; if (kept > 9) exit } }
            seen && kept { print }
          ' source/CHANGELOG.md > earlier.md
          if [ -s earlier.md ]; then
            {
              echo
              echo "<details><summary><b>Also in recent updates</b> (if you skipped a few)</summary>"
              echo
              # Each version's own heading, a step smaller so this version's notes stay on top.
              sed 's/^## /#### /' earlier.md
              echo
              echo "Every version's notes are in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
              echo "</details>"
            } >> changes.md
          fi
          # The release notes: this version, then what came just before it.
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "WoodSketch $VERSION" \
            --notes-file changes.md
