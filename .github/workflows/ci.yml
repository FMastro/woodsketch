name: CI

# Build, lint and test on every platform WoodSketch ships for. The UI tests need a GPU, so
# they run locally; here the plain crates' tests run and everything is compiled and linted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layout is `rustfmt.toml`'s to decide, so nobody spends a review on it. One platform is enough:
  # the same config gives the same answer everywhere.
  fmt:
    name: the code is laid out as rustfmt.toml says
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check the formatting
        run: cargo fmt --all --check

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (without the GPU)
        shell: bash
        run: cargo test --locked -p woodsketch-doc -p woodsketch-tools -p woodsketch-view -p woodsketch-cli -p woodsketch
      # ui-egui's own tests need a GPU, but its unit tests don't, and one of them reads the real
      # CHANGELOG and asserts its newest section is the running version. That guard was only ever
      # run by hand until now.
      - name: Unit tests that need no GPU (the CHANGELOG guard is one)
        shell: bash
        run: cargo test --locked -p woodsketch-ui-egui --lib

  unreleased:
    name: nothing shipped sits at a released version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares HEAD against the newest v* tag, so it needs the history and tags.
          fetch-depth: 0
      - name: Check for source that no release can describe
        run: python3 -I scripts/check-unreleased.py --verbose

  notices:
    name: the notices name every package that ships
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every platform's packages, not this runner's: the same notices ship beside all four
      # builds, so the file names what Windows, macOS and Linux each pull in.
      - name: Fetch every package's source
        run: cargo fetch --locked
      - name: Check THIRD-PARTY-NOTICES.md against the dependencies
        run: python3 -I scripts/make-notices.py --check

  guide:
    name: the User Guide is current and builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ui-egui's other integration tests need a GPU, which is why the `check` job runs only its
      # unit tests; this one needs none -- it reads `doc` and `tools` and writes Markdown. It is
      # what holds the reference pages to what the app actually does, so it has to run somewhere.
      - name: The reference pages still say what the app does
        run: cargo test --locked -p woodsketch-ui-egui --test guide
      # The pages are committed, so the book builds without running that test; what the build
      # catches is a page missing from SUMMARY.md and Markdown mdBook won't take.
      - name: Install mdBook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.local/bin
      - name: Build it
        run: ~/.local/bin/mdbook build docs/guide
      - name: Every drawing actually drew
        run: python3 -I scripts/check-guide-pages.py
      - name: Every joint has a picture
        run: python3 -I scripts/make-guide-pictures.py --check
      - name: Every toolbar icon the stylesheet asks for is really there
        run: python3 -I scripts/check-guide-icons.py
      - name: Keep it, so the site can be served the very build that was checked
        uses: actions/upload-artifact@v4
        with:
          name: user-guide
          path: docs/guide/book
          retention-days: 7
