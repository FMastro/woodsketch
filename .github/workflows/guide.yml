name: User Guide

# Publishes docs/guide to GitHub Pages, which is what woodsketch.net/help serves: the site is a
# static Vercel deploy from the woodsketchweb repo, and a rewrite there proxies /help to this.
# The guide is built in this repository because its reference pages are generated from the app
# (crates/ui-egui/tests/guide.rs), so a feature and its page land in one commit.
#
# It follows main. `crates/**` is in the paths because the reference pages are generated from
# the app, so a changed shortcut or a new joint is a changed guide even when nothing under
# docs/ was touched; the build is a few minutes and the deploy is idempotent, so republishing
# a guide that turned out identical costs nothing worth saving. `workflow_dispatch` stays for
# republishing by hand after a change somewhere this cannot see, such as the Pages settings.
on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'crates/**'
      - 'scripts/check-guide-icons.py'
      - 'scripts/make-guide-pictures.py'
      - '.github/workflows/guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a run in progress finish rather than publishing half of it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Never publish pages that have fallen behind the app. CI runs this on every push as well;
      # it is repeated here because this is the job that puts them in front of people.
      - name: The reference pages still say what the app does
        run: cargo test --locked -p woodsketch-ui-egui --test guide
      - name: Install mdBook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.local/bin
      - name: Build it
        run: ~/.local/bin/mdbook build docs/guide
      - name: Every joint has a picture
        run: python3 -I scripts/make-guide-pictures.py --check
      - name: Every toolbar icon the stylesheet asks for is really there
        run: python3 -I scripts/check-guide-icons.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide/book
      - id: deploy
        uses: actions/deploy-pages@v4
