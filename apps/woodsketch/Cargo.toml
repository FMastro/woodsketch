[package]
name = "woodsketch"
description = "WoodSketch: a SketchUp-style 3D modeler in pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
woodsketch-ui-egui.workspace = true
eframe.workspace = true
env_logger.workspace = true
# public-utils: `bundle::Manifest`, which naming an update source of our own needs (`releases.rs`).
velopack = { version = "=1.2.161", features = ["public-utils"] }
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
log = { workspace = true, default-features = false }

[dev-dependencies]
# `tests/packaging.rs` holds the Linux desktop and MIME files to what a drawing really is.
woodsketch-doc.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
